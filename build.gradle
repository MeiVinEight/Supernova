buildscript {
	repositories {
		// Add repositories to retrieve artifacts from in here.
		// You should only use this when depending on other mods because
		// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
		// See https://docs.gradle.org/current/userguide/declaring_repositories.html
		// for more information about repositories.
		maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
		maven { url 'https://repository.hanbings.io/proxy' }
	}
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://maven.aliyun.com/nexus/content/groups/public" }
	maven { url "https://repository.hanbings.io/proxy" }
	maven { url "https://cursemaven.com" }
	maven { url "https://api.modrinth.com/maven" }
	flatDir { dir "libs" }
	flatDir { dir "libs/create" }
	flatDir { dir "run/mods" }
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/supernova.classtweaker")

	mods {
		"supernova" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	implementation ':core:3.8.0'
	implementation ':toml:3.8.0'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	//mappings loom.officialMojangMappings()
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation ':ForgeConfigAPIPort:v26.1.5-mc26.1.x-Fabric'
	//modImplementation "maven.modrinth:modmenu:11.0.1"
	//implementation "maven.modrinth:placeholder-api:2.4.2+1.21"
	//modCompileOnly ":ServerReplay:1.2.10+mc1.21.1"
	//modCompileOnly ":fabric-carpet:1.21-1.4.147+v240613"
	//modImplementation "maven.modrinth:crawl:KQ0hsUlb"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
